name: MemeHunter CI

# نسخه: V1.3.0
# CI کامل: lint + test + نسخه
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # هر 6 ساعت یک‌بار اسکن دوره‌ای
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------- #
  # Job 1: Lint کد پایتون
  # ----------------------------------------------------------------- #
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: "Lint (pycodestyle)"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pycodestyle
        run: |
          python -m pip install --upgrade pip
          pip install pycodestyle

      - name: Run pycodestyle
        run: |
          # بررسی سبک کد (خطاها فقط، نه هشدارها)
          pycodestyle --max-line-length=120 --select=E9,F63,F7,F82 --show-source --show-pep8 src/ main.py || true
          # بررسی خطاهای بحرانی
          pycodestyle --max-line-length=120 --select=E9 src/ main.py

  # ----------------------------------------------------------------- #
  # Job 2: تست‌های واحد
  # ----------------------------------------------------------------- #
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: "Tests (unittest + pytest)"
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        env:
          TELEGRAM_BOT_TOKEN: ""
          TELEGRAM_CHAT_ID: ""
        run: |
          python -m unittest discover tests -v

      - name: Run pytest (if installed)
        continue-on-error: true
        run: |
          pip install pytest
          pytest tests/ -v --tb=short || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: |
            reports/
            data/
          retention-days: 7

  # ----------------------------------------------------------------- #
  # Job 3: بررسی نسخه
  # ----------------------------------------------------------------- #
  version-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: "Version Check"
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check VERSION file format
        run: |
          if [ ! -f VERSION ]; then
            echo "❌ فایل VERSION موجود نیست"
            exit 1
          fi
          VERSION=$(grep -E '^V[0-9]+\.[0-9]+\.[0-9]+$' VERSION || true)
          if [ -z "$VERSION" ]; then
            echo "❌ فرمت VERSION نامعتبر است. باید V1.2.3 باشد"
            cat VERSION
            exit 1
          fi
          echo "✓ نسخه صحیح: $VERSION"

      - name: Check CHANGELOG has version entry
        run: |
          VERSION=$(grep -E '^V[0-9]+\.[0-9]+\.[0-9]+$' VERSION)
          # حذف V از ابتدا برای جستجو در CHANGELOG
          if ! grep -q "## $VERSION" CHANGELOG.md; then
            echo "⚠ هشدار: نسخه $VERSION در CHANGELOG.md پیدا نشد"
          else
            echo "✓ نسخه $VERSION در CHANGELOG.md ثبت شده"
          fi

  # ----------------------------------------------------------------- #
  # Job 4: اسکن دوره‌ای (فقط در schedule)
  # ----------------------------------------------------------------- #
  scheduled-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: "Scheduled Scan"
    if: github.event_name == 'schedule'
    needs: version-check
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run MemeHunter scan
        run: |
          python main.py --format detailed --save --telegram --advanced

      - name: Run backtest
        run: |
          python main.py --backtest --save || true

      - name: Upload report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: memehunter-report-${{ github.run_id }}
          path: |
            reports/
            data/
          retention-days: 90
