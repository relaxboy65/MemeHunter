name: MemeHunter CI V2.1.0

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "حداکثر تعداد کوین"
        required: false
        default: "15"
      advanced:
        description: "تحلیل پیشرفته (true/false)"
        required: false
        default: "true"
      send_telegram:
        description: "ارسال به تلگرام (true/false)"
        required: false
        default: "true"

permissions:
  contents: write
  actions: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: "Lint — V2.1.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install pycodestyle
      - run: |
          pycodestyle --max-line-length=120 --select=E9,F63,F7,F82 --show-source src/ main.py || true
          pycodestyle --max-line-length=120 --select=E9 src/ main.py

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: "Tests — V2.1.0"
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - run: python -m unittest discover tests -v
      - continue-on-error: true
        run: pytest tests/ -v --tb=short || true

  version-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: "Version Check — V2.1.0"
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Check VERSION
        run: |
          VERSION=$(grep -E '^V[0-9]+\.[0-9]+\.[0-9]+$' VERSION || true)
          test -n "$VERSION"
          echo "Version OK: $VERSION"
          grep -q "$VERSION" .github/workflows/daily-scan.yml

  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    name: "Scan — V2.1.0"
    needs: version-check
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Prepare folders
        run: |
          mkdir -p data reports
          if [ ! -f data/coins_database.csv ]; then
            echo "scan_date,scan_timestamp,coin_id,symbol,name,current_price_usd,market_cap_usd,volume_24h_usd,change_24h_pct,change_7d_pct,rsi,macd_hist,ma_short,ma_long,ma_bullish,volume_surge_ratio,price_momentum_pct,score,signal,confidence,atr,atr_percent,bollinger_percent_b,bollinger_squeeze,liquidity_score,liquidity_is_real,liquidity_spread,liquidity_imbalance,sweep_detected,sweep_type,orderflow_buy_pressure,orderflow_sell_pressure,orderflow_is_real,large_swap_count,large_buys,large_sells,mtf_confluence_score,mtf_aligned_count,data_sources,telegram_message_id" > data/coins_database.csv
          fi
          ls -la data/; wc -l data/*.csv || true
      - name: Run MemeHunter scan
        run: |
          set -o pipefail
          LIMIT="${{ github.event.inputs.limit || '15' }}"
          ADVANCED="${{ github.event.inputs.advanced || 'true' }}"
          SEND_TG="${{ github.event.inputs.send_telegram || 'true' }}"
          CMD="python main.py --limit $LIMIT --format detailed --save --verbose"
          if [ "$ADVANCED" = "true" ]; then CMD="$CMD --advanced --real-data"; fi
          if [ "$SEND_TG" = "true" ]; then CMD="$CMD --telegram"; fi
          echo "Running: $CMD"
          $CMD 2>&1 | tee reports/scan_console.log
      - name: Run backtest (best effort)
        continue-on-error: true
        run: python main.py --backtest --save 2>&1 | tee reports/backtest_console.log || true
      - name: Actions log digest
        if: always()
        run: |
          echo "========== ACTIONS LOG DIGEST =========="
          grep -E "MH_RUN_START|MH_RUN_END" data/activity.log reports/scan_console.log 2>/dev/null || true
          grep -A60 "RUN_REPORT" data/activity.log 2>/dev/null | head -50 || true
          grep -E "PHASE_START:|PHASE_END:" data/activity.log 2>/dev/null || true
          grep "ERROR_RECORDED" data/activity.log 2>/dev/null || true
          grep "RUN_SUMMARY_JSON" data/activity.log 2>/dev/null | tail -1 || true
          grep "DATA_SAVE_OK" data/activity.log 2>/dev/null || true
          echo "========== END DIGEST =========="
      - name: Verify data/
        if: always()
        run: |
          ls -la data/
          test -f data/coins_database.csv
          echo "lines: $(wc -l < data/coins_database.csv)"
      - name: Commit data/ databases
        if: always()
        run: |
          set -e
          git config user.name "MemeHunter-Bot"
          git config user.email "memehunter-bot@users.noreply.github.com"
          git add data/coins_database.csv data/.gitkeep || true
          if git diff --cached --quiet; then
            echo "No DB changes"
          else
            VERSION=$(grep -E '^V[0-9]+\.[0-9]+\.[0-9]+$' VERSION || echo V2.1.0)
            git commit -m "data: update databases after scan ($VERSION) [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
      - name: Enforce golden rule
        if: always()
        run: python scripts/enforce_law.py --dry-run || true
      - name: Upload logs only (Artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memehunter-V2.1.0-log-${{ github.run_id }}
          path: |
            data/activity.log
            reports/scan_console.log
            reports/backtest_console.log
          if-no-files-found: warn
          retention-days: 90
